<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CKEditor 4 + MathType demo</title>

    <!-- Demo styles -->
    <link rel="stylesheet" href="../styles.css" />

    <!-- CKEditor 4 -->
    <script src="https://cdn.ckeditor.com/4.22.1/standard-all/ckeditor.js"></script>

    <!-- MathType plugin -->
    <script>
        CKEDITOR.plugins.addExternal(
            'ckeditor_wiris',
            'https://cdn.jsdelivr.net/npm/@wiris/mathtype-ckeditor4/',
            'plugin.js'
        );
    </script>
</head>

<body>
    <main class="container">
        <h1>CKEditor 4 + MathType Plugin + Java backend services</h1>
        <p class="hint">Use the MathType and Chemistry buttons in the toolbar.</p>

        <textarea id="editor">Type here...</textarea>
    </main>

    <!-- Cloud MathType Render Engine (renders formulas as images on target pages) -->
    <script src="https://www.wiris.net/demo/plugins/app/WIRISplugins.js?viewer=image"></script>
    <!-- Local MathType Render Engine (renders formulas as images on target pages) -->
    <!-- <script src="http://localhost:8080/pluginwiris_engine/app/WIRISplugins.js?viewer=image"></script> -->

    <!-- Demo app -->
    <script src="./app.js"></script>
</body>

</html>
