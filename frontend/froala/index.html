<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Froala + MathType demo</title>

    <!-- Froala styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/froala_editor.pkgd.min.css"

      <h1>Froala + MathType Plugin + Java backend services</h1>
