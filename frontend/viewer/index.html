<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathType Render Engine Demo</title>
    <!-- MathType Render Engine (renders formulas as images on target pages) -->
    <script src="https://www.wiris.net/demo/plugins/app/WIRISplugins.js?viewer=image"></script>
    <!-- Demo styles -->
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header>
        <h1>MathTpe Render Engine Demo</h1>
    </header>
    <main class="container">
        <!-- Set your MathML here -->
        <math xmlns="http://www.w3.org/1998/Math/MathML">
            <msup>
                <mi>x</mi>
                <mn>2</mn>
            </msup>
            <mo>+</mo>
            <mn>1</mn>
        </math>
    </main>
  </body>
  </html>
